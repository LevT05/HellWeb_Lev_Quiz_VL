<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <Style>
        body{
            padding: 0;
            margin: 0;
            background-color: rgb(25, 0, 255);
            font-family: "Press Start 2P", system-ui;


        }
        header{
            height: 10vb;
            text-align: center;
            color: yellow;
            letter-spacing: 5px;
            margin-top: 3rem;
        }
        main{
            height: 80vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #start{
            text-decoration: none;
            color: black;
            font-size: 4rem;
            animation: rainbow 3s infinite ease-in-out;
            transition: all ease-in-out .5s;
        }
        #start:hover{
            transform: scale(1.5);
        }
        @keyframes rainbow{
            0%{color: red;}
            10%{color: rgb(255, 149, 0);}
            20%{color: #ffdd00;}
            30%{color: rgb(221, 255, 0);}
            40%{color: rgb(145, 255, 0);}
            50%{color: rgb(0, 255, 119);}
            60%{color: rgb(0, 255, 187);}
            70%{color: rgb(0, 213, 255);}
            80%{color: rgb(136, 0, 255);}
            90%{color: rgb(238, 0, 255);}
            100%{color: rgb(255, 0, 102);}
        }
    </Style>
</head>
<body>
    <header>
        <h1>Epic Lev project</h1>
        <h2>Terekhovskyi</h2>
    </header>
    <main>
        <a href="Task1/task1.html" id="start">Start</a>
    </main>
    <audio loop autoplay>
        <source src="#">
    </audio>
</body>
</html>
